apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bakchago
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: 438465148189.dkr.ecr.ap-northeast-2.amazonaws.com/bakchago-frontend:test-2
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://backend.bakchago.svc.cluster.local:8080"
            - name: APP_VERSION
              value: "test-2"
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bakchago
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 3000